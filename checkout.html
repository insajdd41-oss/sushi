                    <form id="checkout-form">
                        <div class="form-group">

                        </div>
                        <div class="form-group">
                            <label>Комментарий для курьера</label>
                            <textarea class="form-control" rows="3" placeholder="Если у вас в подъезде требуется позвонить по домофону..."></textarea>
                        </div>
                        <p class="text-muted">Доставка 10-15 мин</p>
                        <button type="submit" class="btn btn-warning btn-lg btn-block font-weight-bold">Оплатить (СБП)</button>
                        <button type="button" class="btn btn-secondary btn-block mt-2">Отмена</button>
