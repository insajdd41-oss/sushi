    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">
                <div class="card p-4">
                    <h3 class="mb-4">Добавить новое блюдо</h3>
                    <form id="addDishForm">
                        <div class="form-group">
                            <label for="dishTitle">Название блюда</label>
                            <input type="text" class="form-control" id="dishTitle" name="title" placeholder="Например, Сет Калифорния">
                        </div>
                        <div class="form-group">
                            <label for="dishCategory">Категория</label>
                            <select class="form-control" id="dishCategory" name="category">
                                <option value="Роллы">Роллы</option>
                                <option value="Сеты">Сеты</option>
                                <option value="Горячее">Горячее</option>
                                <option value="Напитки">Напитки</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <label for="dishPrice">Цена (₽)</label>
                                    <input type="number" class="form-control" id="dishPrice" name="price" placeholder="550" min="0" step="1">
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-group">
                                    <label for="dishWeight">Вес (г)</label>
                                    <input type="number" class="form-control" id="dishWeight" name="weight" placeholder="240" min="0" step="1">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="dishDescription">Описание блюда</label>
                            <textarea class="form-control" id="dishDescription" name="description" rows="3" placeholder="Укажите состав блюда, соусы, КБЖУ..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="imgInput">Изображение блюда</label>
                            <div class="custom-file">
                                <input type="file" class="custom-file-input" id="imgInput" name="image" accept="image/*">
                                <label class="custom-file-label" for="imgInput">
                                    <i class="fas fa-cloud-upload-alt"></i> Загрузить файл
                                </label>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <button type="button" class="btn btn-secondary px-4">Отмена</button>
                            <button type="submit" class="btn btn-danger px-4">Добавить в меню</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
